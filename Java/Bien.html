<!DOCTYPE html>
<html>
<head>
    <title>Biến trong JavaScript</title>
</head>
<body>
    <h1>Kiểm tra biến trong Console</h1>

    <script>
        // Khai báo các biến
        let ten = "Nguyễn Văn A";
        let tuoi = 22;
        const chieuCao = 1.75; // mét
        let dangHocJS = true;

        // In ra console
        console.log("Tên:", ten);
        console.log("Tuổi:", tuoi);
        console.log("Chiều cao:", chieuCao + " m");
        console.log("Đang học JavaScript?", dangHocJS);
    </script>
</body>
</html>
