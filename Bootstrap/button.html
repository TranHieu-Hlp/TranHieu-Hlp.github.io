Cấu trúc chung:
 <!--<button type="button" class="btn btn-*">...</button>-->
<button class="btn btn-default">Default</button>	Xám nhạt	Nút mặc định, không nhấn mạnh
<button class="btn btn-primary">Primary</button>	Xanh dương đậm	Hành động chính (ví dụ: Gửi form)
<button class="btn btn-success">Success</button>	Xanh lá cây	Hành động thành công (ví dụ: Lưu)
<button class="btn btn-info">Info</button>	Xanh nhạt	Thông tin phụ
<button class="btn btn-warning">Warning</button>	Vàng cam	Cảnh báo
<button class="btn btn-danger">Danger</button>	Đỏ	Xoá, nguy hiểm
<button class="btn btn-link">Link</button>	Như liên kết (chữ xanh)	Giống hyperlink, ít nhấn mạnh

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Buttons</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
  <div class="container">
    <h3>Button Styles</h3>
    <button type="button" class="btn btn-default">Default</button>
    <button type="button" class="btn btn-primary">Primary</button>
    <button type="button" class="btn btn-success">Success</button>
    <button type="button" class="btn btn-info">Info</button>
    <button type="button" class="btn btn-warning">Warning</button>
    <button type="button" class="btn btn-danger">Danger</button>
    <button type="button" class="btn btn-link">Link</button>
  </div>
</body>
</html>
