<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bootstrap List Group</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
  <div class="container">
    <h3>Danh sách với Bootstrap</h3>
    <ul class="list-group">
      <li class="list-group-item">First item</li>
      <li class="list-group-item">Second item</li>
      <li class="list-group-item">Third item</li>
    </ul>
  </div>
</body>
</html>
Thành phần	Ý nghĩa
<ul class="list-group">	Tạo danh sách dạng nhóm (list group)
<li class="list-group-item">	Từng mục trong danh sách, được Bootstrap tạo viền, nền nhẹ
    Tạo list cố thể ấn được.
    <div class="list-group">
        <a href="#" class="list-group-item active">Home</a>
        <a href="#" class="list-group-item">About</a>
        <a href="#" class="list-group-item">Contact</a>
      </div>
